version: '3'

# Tasks for the C# SMAPI mod (StardewMCPBridge).
#
# Invoked from repo root as `task mod:<name>`.
#
# Per-machine config (all optional, override via .env at repo root):
#   SMARTNPC_GAME_PATH - SDV install dir. Leave unset to let ModBuildConfig
#                        auto-discover (works for standard Steam installs on
#                        Windows / Linux / macOS).
#   DOTNET             - dotnet executable. Defaults to `dotnet` on PATH.

vars:
  CONFIG: '{{default "Debug" .CONFIG}}'
  MOD_NAME: StardewMCPBridge
  # dotnet: prefer env DOTNET → otherwise `dotnet` on PATH (works on Linux /
  # macOS / Windows with .NET 6 SDK installed).
  DOTNET: '{{default "dotnet" .DOTNET}}'
  # Build output dir (relative to this Taskfile). TargetFramework comes from
  # the csproj; kept in sync here for the install copy step.
  BUILD_OUT_WIN: 'bin\{{.CONFIG}}\net6.0'
  BUILD_OUT_NIX: 'bin/{{.CONFIG}}/net6.0'
  # ModBuildConfig auto-deploys to <SDV>/Mods/<AssemblyName>/ when
  # EnableModDeploy is true. The manual install task below is only needed
  # when auto-deploy is disabled or the env has a non-default SDV path.
  SMARTNPC_GAME_PATH: '{{default "" .SMARTNPC_GAME_PATH}}'

tasks:
  build:
    desc: Build the SMAPI mod (compile only; no auto-deploy to game Mods/)
    cmds:
      # EnableModDeploy=false → dotnet compiles the DLL but does not copy
      # into <SDV>/Mods. Deployment is driven by `task mod:install`, which
      # also kills a running game process to release the DLL lock. This lets
      # `task ci` stay green while the game is running.
      - cmd: '"{{.DOTNET}}" build -c {{.CONFIG}} /p:EnableModDeploy=false'
    sources:
      - '*.cs'
      - '**/*.cs'
      - '*.csproj'
      - manifest.json

  install:
    desc: Build the mod and copy outputs to <SMARTNPC_GAME_PATH>/Mods/<ModName>/
    deps: [build]
    preconditions:
      - sh: 'test -n "{{.SMARTNPC_GAME_PATH}}"'
        msg: 'SMARTNPC_GAME_PATH is unset. Set it in .env or rely on ModBuildConfig EnableModDeploy auto-copy.'
    cmds:
      # Windows: kill game process if running, then deploy
      - cmd: powershell -NoProfile -Command "Get-Process -Name 'Stardew Valley','StardewModdingAPI' -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Milliseconds 500"
        platforms: [windows]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.SMARTNPC_GAME_PATH}}\Mods\{{.MOD_NAME}}' | Out-Null; Copy-Item -Force -Path '{{.BUILD_OUT_WIN}}\{{.MOD_NAME}}.dll','{{.BUILD_OUT_WIN}}\{{.MOD_NAME}}.deps.json','{{.BUILD_OUT_WIN}}\manifest.json' -Destination '{{.SMARTNPC_GAME_PATH}}\Mods\{{.MOD_NAME}}\'; Write-Host '[mod] installed to {{.SMARTNPC_GAME_PATH}}\Mods\{{.MOD_NAME}}' -ForegroundColor Green"
        platforms: [windows]
      # Linux / macOS: kill game process if running, then deploy
      - cmd: |
          set -e
          if pgrep -f "StardewModdingAPI|Stardew Valley" >/dev/null 2>&1; then
            echo "[mod] killing game process..."
            pkill -f "StardewModdingAPI|Stardew Valley" || true
            sleep 1
          fi
          dest="{{.SMARTNPC_GAME_PATH}}/Mods/{{.MOD_NAME}}"
          mkdir -p "$dest"
          cp -f "{{.BUILD_OUT_NIX}}/{{.MOD_NAME}}.dll" "$dest/"
          cp -f "{{.BUILD_OUT_NIX}}/{{.MOD_NAME}}.deps.json" "$dest/"
          cp -f "{{.BUILD_OUT_NIX}}/manifest.json" "$dest/"
          echo "[mod] installed to $dest"
        platforms: [linux, darwin]

  test:
    desc: (placeholder) C# tests not yet introduced
    cmds:
      - cmd: echo '[mod] no tests yet'

  clean:
    desc: Remove build outputs
    cmds:
      - cmd: powershell -NoProfile -Command "if (Test-Path bin) { Remove-Item -Recurse -Force bin }; if (Test-Path obj) { Remove-Item -Recurse -Force obj }"
        platforms: [windows]
      - cmd: rm -rf bin obj
        platforms: [linux, darwin]
