version: '3'

# Tasks for the smartnpc-mcp Go module.
# Invoke from repo root as `task mcp:<name>` or directly inside this dir.

vars:
  BIN_DIR: bin
  BIN_NAME:
    sh: 'echo smartnpc-mcp{{if eq OS "windows"}}.exe{{end}}'

tasks:
  build:
    desc: Build smartnpc-mcp binary
    cmds:
      - go build -o {{.BIN_DIR}}/{{.BIN_NAME}} ./cmd/smartnpc-mcp
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BIN_DIR}}/{{.BIN_NAME}}'

  test:
    desc: Run smartnpc-mcp tests
    cmds:
      - go test ./...

  test-race:
    desc: Run tests with -race
    cmds:
      - go test -race ./...

  lint:
    desc: go vet
    cmds:
      - go vet ./...

  run:
    desc: 'Build & launch smartnpc-mcp HTTP mode on :PORT (default $SMARTNPC_HTTP_PORT or 3000).
      Args: PORT=3000 WS_URL=$SMARTNPC_WS_URL ECHO=0. Example: task mcp:run PORT=3000 WS_URL=ws://localhost:18745/ws.
      Windows launches in a detached window; Linux/macOS runs in the foreground (Ctrl+C to stop).'
    deps: [build]
    vars:
      PORT: '{{default (default "3000" .SMARTNPC_HTTP_PORT) .PORT}}'
      WS_URL: '{{default (default "" .SMARTNPC_WS_URL) .WS_URL}}'
      ECHO: '{{default "0" .ECHO}}'
      ECHO_FLAG: '{{if eq .ECHO "1"}}--echo-mode{{end}}'
    cmds:
      # Launch in a detached visible cmd window so the dev can see logs and
      # Ctrl+C to stop. Stays alive after this task returns.
      - cmd: cmd /c start "smartnpc-mcp :{{.PORT}}" cmd /k "cd /d {{.USER_WORKING_DIR}} && {{.BIN_DIR}}\{{.BIN_NAME}} --http :{{.PORT}} --log-level=debug --ws-url=\"{{.WS_URL}}\" {{.ECHO_FLAG}}"
        platforms: [windows]
      # Foreground run on Linux/macOS. Ctrl+C stops it; no detached window.
      - cmd: ./{{.BIN_DIR}}/{{.BIN_NAME}} --http :{{.PORT}} --log-level=debug --ws-url="{{.WS_URL}}" {{.ECHO_FLAG}}
        platforms: [linux, darwin]

  run-echo:
    desc: Shortcut for `task mcp:run ECHO=1 WS_URL=ws://localhost:18745/ws` — echo NPC, no LLM.
    cmds:
      - task: run
        vars:
          ECHO: '1'
          WS_URL: '{{default "ws://localhost:18745/ws" .SMARTNPC_WS_URL}}'

  stop:
    desc: Kill any running smartnpc-mcp.exe on this machine
    cmds:
      - cmd: powershell -NoProfile -Command "Get-Process smartnpc-mcp -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Host '[mcp] stopped' -ForegroundColor Yellow"
        platforms: [windows]
      - cmd: pkill -f 'smartnpc-mcp --http' || true
        platforms: [linux, darwin]

  health:
    desc: 'Probe local mcp /healthz. Args: PORT=3000'
    vars:
      PORT: '{{default "3000" .PORT}}'
    cmds:
      - cmd: powershell -NoProfile -Command "try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:{{.PORT}}/healthz -TimeoutSec 2).Content } catch { Write-Host '[mcp] not reachable on :{{.PORT}}' -ForegroundColor Red; exit 1 }"
        platforms: [windows]
      - cmd: curl -fsS http://127.0.0.1:{{.PORT}}/healthz
        platforms: [linux, darwin]

  clean:
    desc: Remove build outputs
    cmds:
      - cmd: powershell -NoProfile -Command "if (Test-Path '{{.BIN_DIR}}') { Remove-Item -Recurse -Force '{{.BIN_DIR}}' }"
        platforms: [windows]
      - cmd: rm -rf {{.BIN_DIR}}
        platforms: [linux, darwin]
