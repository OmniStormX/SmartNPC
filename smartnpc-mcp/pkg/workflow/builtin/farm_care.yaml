id: farm_care
description: 农场养护：巡视 → LLM 动态决策（收菜+浇水+补种）→ 存箱 → 气泡
version: "3"
inputs:
  - name: inspect_radius
    description: 巡视半径
    default: 12
steps:
  # 1. 观测农场
  - kind: tool
    name: npc_inspect_object
    args:
      what: farm_actions
      radius: "$inspect_radius"
    save_as: obs

  # 2. LLM 动态决策。加载 smartnpc-farm-maintenance skill，
  #    LLM 根据实时 farm_actions 自行决定：
  #    收成熟作物 → 浇水 → 补种空地块（按需）
  - kind: skill_call
    skill: smartnpc-farm-maintenance
    args:
      inspect_radius: "$inspect_radius"

  # 3. 存箱
  - kind: tool
    name: npc_deposit_items
    args:
      auto_find: true
    on_nothing_to_do: skip

  # 4. 收尾气泡
  - kind: tool
    name: npc_show_text_bubble
    args:
      text: "[农场打理好了~]"
