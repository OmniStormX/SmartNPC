id: farm_extension
description: 农场开垦——Agent 根据 smartnpc-farm-extension skill 动态决策
version: "5"
inputs:
  - name: inspect_radius
    description: 巡视半径
    default: 30
  - name: target_seed
    description: 要种的种子 Qualified ID
    default: "(O)472"
  - name: fertilizer_id
    description: 肥料 Qualified ID
    default: "(O)368"
steps:
  - kind: skill_call
    skill: smartnpc-farm-extension
    args:
      inspect_radius: "$inspect_radius"
      target_seed: "$target_seed"
      fertilizer_id: "$fertilizer_id"
