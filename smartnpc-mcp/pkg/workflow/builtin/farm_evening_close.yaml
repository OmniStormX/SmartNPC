id: farm_evening_close
description: 傍晚收尾——Agent 根据 smartnpc-farm-evening-close skill 动态决策
version: "4"
inputs:
  - name: inspect_radius
    description: 巡视半径
    default: 30
  - name: target_seed
    description: 补种的种子 Qualified ID
    default: "(O)472"
steps:
  - kind: skill_call
    skill: smartnpc-farm-evening-close
    args:
      inspect_radius: "$inspect_radius"
      target_seed: "$target_seed"
