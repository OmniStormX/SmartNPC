id: social_interact
description: 玩家互动——Agent 根据 smartnpc-social-interact skill 动态决策
version: "6"
inputs:
  - name: pet_first
    description: 是否先摸宠物再找玩家
    default: true
  - name: deliver_first
    description: 是否先送货再聊天
    default: true
  - name: give_gift
    description: 聊天后是否送小礼物
    default: false
steps:
  - kind: skill_call
    skill: smartnpc-social-interact
    args:
      pet_first: "$pet_first"
      deliver_first: "$deliver_first"
      give_gift: "$give_gift"
