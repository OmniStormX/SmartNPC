version: '3'

# Tasks for the smartnpc-agent Go module.

vars:
  BIN_DIR: bin
  BIN_NAME:
    sh: 'echo smartnpc-agent{{if eq OS "windows"}}.exe{{end}}'

tasks:
  build:
    desc: Build smartnpc-agent binary
    cmds:
      - go build -o {{.BIN_DIR}}/{{.BIN_NAME}} ./cmd/smartnpc-agent
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BIN_DIR}}/{{.BIN_NAME}}'

  test:
    desc: Run smartnpc-agent tests
    env:
      GOTMPDIR: '{{.ROOT_DIR}}/.gotmp'
    cmds:
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force .gotmp | Out-Null"
        platforms: [windows]
      - cmd: mkdir -p .gotmp
        platforms: [linux, darwin]
      - go test ./...

  test-race:
    desc: Run tests with -race
    env:
      GOTMPDIR: '{{.ROOT_DIR}}/.gotmp'
    cmds:
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force .gotmp | Out-Null"
        platforms: [windows]
      - cmd: mkdir -p .gotmp
        platforms: [linux, darwin]
      - go test -race ./...

  lint:
    desc: go vet
    cmds:
      - go vet ./...

  clean:
    desc: Remove build outputs
    cmds:
      - cmd: powershell -NoProfile -Command "if (Test-Path '{{.BIN_DIR}}') { Remove-Item -Recurse -Force '{{.BIN_DIR}}' }"
        platforms: [windows]
      - cmd: rm -rf {{.BIN_DIR}}
        platforms: [linux, darwin]
