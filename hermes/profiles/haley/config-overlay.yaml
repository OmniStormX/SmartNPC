# Config overlay for hermes/profiles/haley/config.yaml
#
# Two blocks that must be merged into ~/.hermes/profiles/haley/config.yaml:
#
#   1. mcp_servers  — so Hermes connects to smartnpc-mcp's MCP server
#                     and discovers game tools (chat_say, game_get_time, ...).
#   2. API_SERVER_* — so Hermes Gateway opens a REST endpoint that the
#                     smartnpc-mcp hermesrelay can POST events to.
#
# install.sh appends both to the target config.yaml on first sync (it does
# NOT overwrite an existing top-level mcp_servers: block — review manually
# in that case). __HOST_IP__ is substituted to the WSL default gateway IP.
#
# Prerequisites:
#   - smartnpc-mcp running in --http :3000 mode (task mcp:run)
#   - Hermes Gateway started against this profile:
#       hermes -p haley gateway run --accept-hooks

mcp_servers:
  smartnpc_game:
    # WSL→Windows host IP; install.sh fills this in automatically.
    # On mirrored-mode WSL you can use http://127.0.0.1:3000/mcp instead.
    url: http://__HOST_IP__:3000/mcp
    timeout: 60
    connect_timeout: 10
    tools:
      # Explicit whitelist of tools Haley may see. Narrower than the
      # full mcp-tools catalog on purpose — a low-cardinality tool menu keeps
      # the per-turn token bill down and reduces misfires on short, high-
      # frequency chat turns. chat_say is the only sanctioned way to speak
      # visibly; the rest cover read-only state, inter-NPC DM, and the
      # proactive-visit / gift flow. Deliberately held back:
      #   - ping, mail_send               (not NPC speech)
      #   - npc_broadcast_event           (world-wide fan-out; admin only)
      #   - npc_get_environment           (superset of granular tools below)
      #   - npc_get_named_locations       (static table; redundant)
      #   - npc_move_to / npc_face_direction (free-form physical action)
      #   - npc_follow_start/stop / npc_lead_to (escort flow, off-scope)
      # To drop the whitelist temporarily for debugging, swap to `exclude: []`.
      include:
        - chat_say
        - friendship_get
        - game_get_time
        - game_get_weather
        - player_get_status
        - npc_get_position
        - npc_get_nearby
        - npc_get_behavior
        - npc_send_message
        - npc_inbox_get
        - npc_inbox_ack
        - npc_summon
        - npc_emote
        - npc_give_item
      resources: false
      prompts: false

# REST gateway so external systems (smartnpc-mcp hermesrelay, curl) can
# inject messages into this profile's conversation. The gateway exposes
# /v1/responses (OpenAI Responses API shape) on API_SERVER_PORT.
#
# IMPORTANT: each profile that wants its own gateway needs a unique port.
# If you run haley and another profile gateway simultaneously, bump the
# port here.
API_SERVER_ENABLED: true
API_SERVER_KEY: smartnpc-test-key
API_SERVER_HOST: 0.0.0.0
API_SERVER_PORT: 8644
API_SERVER_MODEL_NAME: haley

# Hermes built-in plugin: observability/langfuse — uploads every agent
# turn (LLM calls, tool calls, errors) to Langfuse Cloud for tracing.
# Credentials are NOT stored here; the plugin reads them from
# ~/.hermes/.env (HERMES_LANGFUSE_PUBLIC_KEY / HERMES_LANGFUSE_SECRET_KEY /
# HERMES_LANGFUSE_BASE_URL — standard LANGFUSE_* names also work).
#
# Caveat: if ~/.hermes/profiles/haley/config.yaml already has a
# top-level `plugins:` block (Hermes bootstrap may or may not write one),
# install.sh's dumb append will produce a duplicate key and PyYAML will
# silently keep the LAST one. Merge by hand in that case, or reset the
# profile via scripts/reset_hermes_overlay.sh first.
plugins:
  enabled:
    - observability/langfuse

# Note: model.context_length, compression.*, and agent.tool_use_enforcement
# are NOT in this overlay because Hermes' bootstrapped config.yaml already
# defines those top-level keys, and install.sh does a dumb append — so
# writing them here would create duplicate YAML keys, and PyYAML silently
# lets the second (overlay) block clobber the bootstrap one (which carries
# the real LLM provider/base_url + agent.max_turns etc). Tuning is applied
# via scripts/apply_hermes_tuning.sh, which does a real per-key yaml merge.
