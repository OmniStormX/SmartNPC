# Config overlay for hermes/profiles/abigail/config.yaml
#
# Two blocks that must be merged into ~/.hermes/profiles/abigail/config.yaml:
#
#   1. mcp_servers  — so Hermes connects to smartnpc-mcp's MCP server
#                     and discovers game tools (chat_say, game_get_time, ...).
#   2. API_SERVER_* — so Hermes Gateway opens a REST endpoint that the
#                     smartnpc-mcp hermesrelay can POST events to.
#
# install.sh appends both to the target config.yaml on first sync (it does
# NOT overwrite an existing top-level mcp_servers: block — review manually
# in that case).
#
# URL resolution:
#   Hermes expands ${SMARTNPC_MCP_URL} from the profile's .env at startup.
#   This variable is REQUIRED — set it in each profile's .env or as a
#   system environment variable before starting the gateway.
#   Typical value: http://127.0.0.1:3000/mcp (same-host deployment).
#
# Prerequisites:
#   - smartnpc-mcp running in --http :3000 mode (task mcp:run)
#   - Hermes Gateway started against this profile:
#       hermes -p abigail gateway run --accept-hooks

mcp_servers:
  smartnpc_game:
    url: ${SMARTNPC_MCP_URL}
    timeout: 60
    connect_timeout: 10
    tools:
      # Minimal, module-oriented tool menu. Keep this small: every visible
      # tool schema enters the prompt and affects latency.
      #
      # core/private-chat: agent_register_self, chat_say
      # read-on-demand: friendship_get, game_get_time, game_get_weather,
      #                 player_get_status, npc_get_position
      # schedule: npc_plan_day, npc_get_schedule
      # rich behaviors: world + social actions (stub mode)
      # optional modules: inter-NPC inbox/DM, proactive visit, signature gift
      #
      # Deliberately held back: admin/debug tools, broad environment dumps,
      # mail, broadcast, static tables.
      include:
        - agent_register_self
        - chat_say
        - friendship_get
        - game_get_time
        - game_get_weather
        - player_get_status
        - npc_get_position
        - npc_send_message
        - npc_inbox_get
        - npc_inbox_ack
        - npc_summon
        - npc_emote
        - npc_give_item
        # schedule
        - npc_plan_day
        - npc_get_schedule
        # workflow discovery
        - workflow_list
        - workflow_get
        # world actions
        - npc_wander
        - npc_clear_debris
        - npc_water_crops
        - npc_harvest_crops
        - npc_deposit_items
        - npc_deliver_items
        - npc_forage_collect
        - npc_pet_animal
        - npc_plant_seeds
        - npc_till_soil
        - npc_inspect_object
        - npc_place_object
        - npc_break_resource
        - npc_fertilize
        # social actions
        - npc_approach_and_speak
        - npc_express_emotion
        - npc_shy_retreat
        - npc_show_text_bubble
        - npc_inventory_get
        - npc_idle_activity
        - npc_dance_happy
        - npc_react_surprise
        - npc_pace_anxiously

      resources: false
      prompts: false

# REST gateway so external systems (smartnpc-mcp hermesrelay, curl) can
# inject messages into this profile's conversation. The gateway exposes
# /v1/responses (OpenAI Responses API shape) on API_SERVER_PORT.
#
# IMPORTANT: each profile that wants its own gateway needs a unique port.
# If you run abigail and another profile gateway simultaneously, bump the
# port here.
API_SERVER_ENABLED: true
API_SERVER_KEY: smartnpc-test-key
API_SERVER_HOST: 0.0.0.0
API_SERVER_PORT: 8643
API_SERVER_MODEL_NAME: abigail

# Hermes built-in plugin: observability/langfuse — uploads every agent
# turn (LLM calls, tool calls, errors) to Langfuse Cloud for tracing.
# Credentials are NOT stored here; the plugin reads them from
# ~/.hermes/.env (HERMES_LANGFUSE_PUBLIC_KEY / HERMES_LANGFUSE_SECRET_KEY /
# HERMES_LANGFUSE_BASE_URL — standard LANGFUSE_* names also work).
#
# Caveat: if ~/.hermes/profiles/abigail/config.yaml already has a
# top-level `plugins:` block (Hermes bootstrap may or may not write one),
# install.sh's dumb append will produce a duplicate key and PyYAML will
# silently keep the LAST one. Merge by hand in that case, or reset the
# profile via scripts/reset_hermes_overlay.sh first.
plugins:
  enabled:
    - observability/langfuse

# LLM provider for this NPC profile. `hermes -p abigail ...` sets
# HERMES_HOME to ~/.hermes/profiles/abigail, so Hermes loads that
# profile's `.env` and expands these ${HERMES_AGENT_*} references.
model:
  provider: custom:smartnpc-agent
  default: ${HERMES_AGENT_MODEL}
  base_url: ${HERMES_AGENT_URL}
  api_mode: chat_completions
  context_length: 500000

providers:
  smartnpc-agent:
    name: smartnpc-agent
    base_url: ${HERMES_AGENT_URL}
    key_env: HERMES_AGENT_API_KEY
    default_model: ${HERMES_AGENT_MODEL}
    api_mode: chat_completions
    discover_models: false

compression:
  enabled: true
  threshold: 0.30
  target_ratio: 0.25
  protect_last_n: 12
  hygiene_hard_message_limit: 80

agent:
  tool_use_enforcement: false
