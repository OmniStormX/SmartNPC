version: '3'

# SmartNPC root Taskfile.
#
# All build / test / lint / release work goes through `task <name>` so that
# local invocations match CI exactly. See .codebuddy/rules/taskfile-usage.mdc.
#
# Install task: go install github.com/go-task/task/v3/cmd/task@latest
#
# Per-machine config: copy `.env.example` to `.env` and edit.
# `dotenv:` auto-loads it for every task (and propagates to included
# Taskfiles / subprocesses).

dotenv: ['.env']

includes:
  mcp:
    taskfile: ./smartnpc-mcp/Taskfile.yml
    dir: ./smartnpc-mcp
  mod:
    taskfile: ./smapi-mod/Taskfile.yml
    dir: ./smapi-mod

vars:
  GO_MODULES: ./smartnpc-mcp/...

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ── Aggregated tasks ────────────────────────────────────────────

  build:
    desc: Build all subprojects
    cmds:
      - task: mcp:build
      - task: mod:build

  test:
    desc: Run all tests
    cmds:
      - task: mcp:test
      - task: mod:test

  lint:
    desc: Static checks across all Go modules
    cmds:
      - go work sync
      - go vet {{.GO_MODULES}}

  ci:
    desc: Full local equivalent of GitHub Actions CI (profile verify + lint + test + build)
    cmds:
      - task: profiles:verify
      - task: lint
      - task: test
      - task: build

  ci-fast:
    desc: Quick CI (profile verify + lint + test, skip build)
    cmds:
      - task: profiles:verify
      - task: lint
      - task: test

  clean:
    desc: Remove all build artifacts
    cmds:
      - task: mcp:clean
      - task: mod:clean

  # ── Hermes profile render sanity (opt-in) ───────────────────────

  profiles:verify:
    desc: Sanity-check hermes/npcs.yaml, runtime-config, and rendered hermes/profiles/ tree.
    cmds:
      - cmd: bash scripts/test_profile_render.sh
        platforms: [linux, darwin]
      - cmd: bash scripts/test_profile_render.sh
        platforms: [windows]

  # ── Git hooks (opt-in dev convenience) ──────────────────────────

  hooks:enable:
    desc: Enable repo-local git hooks (.githooks). Auto-deploys mod after commits that touch smapi-mod/.
    cmds:
      - cmd: git config core.hooksPath .githooks
      - cmd: powershell -NoProfile -Command "Write-Host '[hooks] enabled — post-commit will auto-install mod when smapi-mod/ changes' -ForegroundColor Green"
        platforms: [windows]
      - cmd: echo '[hooks] enabled — post-commit will auto-install mod when smapi-mod/ changes'
        platforms: [linux, darwin]

  hooks:disable:
    desc: Restore default git hooks path
    cmds:
      - cmd: git config --unset core.hooksPath
      - cmd: powershell -NoProfile -Command "Write-Host '[hooks] disabled' -ForegroundColor Yellow"
        platforms: [windows]
      - cmd: echo '[hooks] disabled'
        platforms: [linux, darwin]

  hooks:status:
    desc: Show whether repo hooks are enabled
    cmds:
      - cmd: powershell -NoProfile -Command "$p = git config --get core.hooksPath; if ($p) { Write-Host \"[hooks] enabled, path=$p\" -ForegroundColor Green } else { Write-Host '[hooks] disabled (using default .git/hooks)' -ForegroundColor Yellow }"
        platforms: [windows]
      - cmd: |
          p=$(git config --get core.hooksPath || true)
          if [ -n "$p" ]; then echo "[hooks] enabled, path=$p"; else echo "[hooks] disabled (using default .git/hooks)"; fi
        platforms: [linux, darwin]

  # ── Dev convenience ─────────────────────────────────────────────

  tidy:
    desc: Run go mod tidy in every Go module
    cmds:
      - cmd: cd smartnpc-mcp && go mod tidy
      - cmd: go work sync
