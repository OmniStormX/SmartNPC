name: Release

# Triggered by pushing a semver tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Builds Go binaries for windows + linux and publishes them as a GitHub
# Release with auto-generated changelog and SHA256SUMS.
#
# The SMAPI mod zip is NOT built in CI: GitHub-hosted runners cannot install
# Stardew Valley, and Pathoschild.Stardew.ModBuildConfig requires the game's
# DLLs to be locally present. To attach the mod zip to a release, build it
# locally and upload it manually:
#
#   task mod:build
#   :: then drag-and-drop smapi-mod/bin/Debug/net6.0/StardewMCPBridge.dll +
#   :: manifest.json (zipped) onto the GitHub Release page after this workflow
#   :: completes.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-releases (v0.2.0-rc1)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write   # required to create releases / upload assets

env:
  GO_VERSION: '1.22'

jobs:
  # ── Pre-flight: extract version ─────────────────────────────────────────
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading 'v' for inner artifact filenames
          VERSION_NUM="${VERSION#v}"
          echo "version=$VERSION_NUM" >> "$GITHUB_OUTPUT"

  # ── Build Go binaries for windows + linux ───────────────────────────────
  build-go:
    name: build-go (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
          - os: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            smartnpc-mcp/go.sum
            smartnpc-agent/go.sum

      - name: go work sync
        run: go work sync

      - name: build smartnpc-mcp
        working-directory: smartnpc-mcp
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../dist
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "../dist/smartnpc-mcp-${{ matrix.os }}${{ matrix.ext }}" \
            ./cmd/smartnpc-mcp

      - name: build smartnpc-agent
        working-directory: smartnpc-agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "../dist/smartnpc-agent-${{ matrix.os }}${{ matrix.ext }}" \
            ./cmd/smartnpc-agent

      - uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ── Create the GitHub Release with all artifacts ────────────────────────
  release:
    name: github release
    needs: [prepare, build-go]
    if: always() && needs.build-go.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: assemble release tree
        run: |
          mkdir -p release
          # Flatten all artifacts into release/
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: generate checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Artifacts

            Go binaries for Windows + Linux are attached. SHA256SUMS.txt
            verifies their integrity.

            **The SMAPI mod zip is not auto-built** — GitHub-hosted runners
            cannot install Stardew Valley. To get the mod, either:

            - clone the repo, run `task mod:build`, and use
              `smapi-mod/bin/Debug/net6.0/{StardewMCPBridge.dll,manifest.json}`
            - or wait for a maintainer to attach the zip manually below.

            ---

            ### Auto-generated changelog
          files: |
            release/*
