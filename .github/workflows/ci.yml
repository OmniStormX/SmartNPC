name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'

# Why no smapi-mod job?
# ---------------------
# The C# mod depends on Stardew Valley assemblies (Stardew Valley.dll,
# 0Harmony.dll from SMAPI, etc.) that ModBuildConfig auto-discovers from a
# local SDV install. GitHub-hosted runners cannot legally install SDV (paid
# game), and stubbing every SDV API for CI is far more work than it's worth
# for a single-developer project. We rely on `task ci` locally to validate
# mod changes before push. See README and .codebuddy/rules/taskfile-usage.mdc.

jobs:
  # ── Detect what changed so we can skip the Go job for doc-only commits ──
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'smartnpc-mcp/**'
              - 'smartnpc-agent/**'
              - 'go.work'
              - 'go.work.sum'
              - 'Taskfile.yml'
            ci:
              - '.github/workflows/**'

  # ── Go: lint + test + build, both modules in one job via go.work ────────
  go:
    name: go (lint + test + build)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            smartnpc-mcp/go.sum
            smartnpc-agent/go.sum

      - name: go work sync
        run: go work sync

      - name: go vet (mcp)
        working-directory: smartnpc-mcp
        run: go vet ./...

      - name: go vet (agent)
        working-directory: smartnpc-agent
        run: go vet ./...

      - name: go test (mcp)
        working-directory: smartnpc-mcp
        run: go test -race -count=1 ./...

      - name: go test (agent)
        working-directory: smartnpc-agent
        run: go test -race -count=1 ./...

      - name: go build (mcp)
        working-directory: smartnpc-mcp
        run: go build -v ./...

      - name: go build (agent)
        working-directory: smartnpc-agent
        run: go build -v ./...

  # ── Aggregate gate so branch protection has a single required check ─────
  ci-pass:
    name: ci-pass
    needs: [go]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          GO_RESULT: ${{ needs.go.result }}
        run: |
          echo "go=$GO_RESULT"
          # Allow 'skipped' (path filter said no relevant changes) and 'success'.
          case "$GO_RESULT" in
            success|skipped) ;;
            *) echo "::error::go job failed (result=$GO_RESULT)"; exit 1;;
          esac
          echo "CI PASS"
