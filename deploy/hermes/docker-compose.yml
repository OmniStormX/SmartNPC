# SmartNPC Hermes Agent — Remote Deployment
#
# Runs all 6 NPC Hermes Gateways on a single server.
# Each service is the same image with different NPC_PROFILE / NPC_PORT.
#
# Usage:
#   cp .env.example .env  # fill in values
#   bash scripts/sync-profiles.sh
#   docker compose up -d
#   docker compose ps     # check health

x-hermes-common: &hermes-common
  build: .
  restart: unless-stopped
  env_file: .env
  environment: &hermes-env
    HERMES_AGENT_URL: ${HERMES_AGENT_URL}
    HERMES_AGENT_API_KEY: ${HERMES_AGENT_API_KEY}
    HERMES_AGENT_MODEL: ${HERMES_AGENT_MODEL:-deepseek-v4-flash}
    HERMES_LANGFUSE_PUBLIC_KEY: ${HERMES_LANGFUSE_PUBLIC_KEY:-}
    HERMES_LANGFUSE_SECRET_KEY: ${HERMES_LANGFUSE_SECRET_KEY:-}
    HERMES_LANGFUSE_BASE_URL: ${HERMES_LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    SMARTNPC_MCP_URL: http://${MCP_PUBLIC_HOST}:${MCP_PUBLIC_PORT:-3000}/mcp

services:
  hermes-xiami:
    <<: *hermes-common
    container_name: hermes-xiami
    environment:
      <<: *hermes-env
      NPC_PROFILE: xiami
      NPC_PORT: "8642"
    ports:
      - "8642:8642"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  hermes-abigail:
    <<: *hermes-common
    container_name: hermes-abigail
    environment:
      <<: *hermes-env
      NPC_PROFILE: abigail
      NPC_PORT: "8643"
