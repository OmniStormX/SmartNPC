# SmartNPC Hermes Agent — Remote Deployment
#
# One-step deploy: cp .env.example .env → fill values → docker compose up -d
# No manual scripts needed. All config is generated from .env at container start.

x-hermes-common: &hermes-common
  build: .
  restart: unless-stopped
  env_file: .env

services:
  hermes-xiami:
    <<: *hermes-common
    container_name: hermes-xiami
    environment:
      NPC_PROFILE: xiami
      NPC_PORT: "8642"
    ports:
      - "8642:8642"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  hermes-abigail:
