# SmartNPC Hermes Agent — Docker Compose
#
# Usage:
#   docker compose pull   # pull latest pre-built image from ghcr.io
#   docker compose up -d  # start all NPC gateways
#
# Local dev (build from source instead of pulling):
#   docker compose up -d --build

x-hermes-common: &hermes-common
  image: ghcr.io/omnistormx/smartnpc-hermes:latest
  build: .
  restart: unless-stopped
  env_file: .env
  networks:
    - smartnpc-net

services:
  hermes-xiami:
    <<: *hermes-common
    container_name: hermes-xiami
    environment:
      NPC_PROFILE: xiami
      NPC_PORT: "8642"
    ports:
      - "8642:8642"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  hermes-abigail:
    <<: *hermes-common
    container_name: hermes-abigail
    environment:
      NPC_PROFILE: abigail
      NPC_PORT: "8643"
